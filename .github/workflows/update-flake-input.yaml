---
name: Update nix flake input

on:
  workflow_dispatch: # allow manual triggering
    inputs:
      flake-input:
        description: The name of the flake input to update
        required: true
        type: string
      scope:
        description: "Lock to update: root (flake.lock + private mirror) or dev (nix/flake.lock)"
        required: true
        type: choice
        options:
          - root
          - dev
        default: root

permissions: {}

jobs:
  update-flake-input:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@b66b36319cc6fde4ea85edd583b088c65d6b8710

      - name: Update ${{ inputs.flake-input }} flake input
        env:
          SCOPE: ${{ inputs.scope }}
          FLAKE_INPUT: ${{ inputs.flake-input }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_PR }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: action@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: action@github.com
        run: gh auth setup-git && bash .github/scripts/update-flake-input.sh "$SCOPE" "$FLAKE_INPUT"
