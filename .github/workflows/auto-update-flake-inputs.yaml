---
name: Auto-update nix flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # runs every day at 08:00 UTC

permissions: {}

jobs:
  update-flake-inputs:
    name: Update flake inputs
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@b66b36319cc6fde4ea85edd583b088c65d6b8710

      - name: Update flake inputs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PR }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: action@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: action@github.com
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh auth setup-git

          # Union of the public flake's inputs and the private flake's
          # direct, non-ssh inputs: private-only inputs still get a PR, for
          # the private lock alone. Followed private inputs are handled by
          # each per-input update via the 'public' input; git+ssh inputs are
          # not updatable from Actions (no SSH keys or host aliases).
          public_inputs=$(nix flake metadata --json | jq -c '.locks.nodes.root.inputs | keys')
          private_inputs=$(jq -c '
            .nodes as $nodes
            | [
              .nodes.root.inputs
              | to_entries[]
              | select(.value | type == "string")
              | select(.key != "public")
              | select(($nodes[.key].locked.url // "") | test("^ssh://") | not)
              | .key
            ]' private/flake.lock)
          inputs=$(printf '%s\n%s' "$public_inputs" "$private_inputs" | jq -c -s 'add | unique')

          failed=()
          for input in $(jq -r '.[]' <<<"$inputs"); do
            bash .github/scripts/update-flake-input.sh root "$input" || failed+=("root:$input")
          done

          # Dev-shell inputs: weekly on Monday (UTC) or on manual dispatch.
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$(date -u +%u)" = 1 ]; then
            for input in $(nix flake metadata --json ./nix | jq -r '.locks.nodes.root.inputs | keys[]'); do
              bash .github/scripts/update-flake-input.sh dev "$input" || failed+=("dev:$input")
            done
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed updates: ${failed[*]}"
            exit 1
          fi
